name: Publish tracker to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - EU4_Achievements.xlsx
      - README.md
      - app.js
      - index.html
      - scripts/export_workbook.py
      - styles.css
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export workbook data
        run: |
          python -m pip install openpyxl
          python scripts/export_workbook.py

      - name: Save refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/achievements.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh exported workbook data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/achievements.json _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
